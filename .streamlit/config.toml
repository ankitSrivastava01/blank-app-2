[server]
headless = true
# Load modules once per process. Restart Streamlit after changing source files.
fileWatcherType = "none"

[client]
showErrorDetails = false

[logger]
level = "info"

[theme]
base = "dark"
primaryColor = "#4ee1b4"
backgroundColor = "#090f1c"
secondaryBackgroundColor = "#14223a"
textColor = "#edf4ff"

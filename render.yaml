services:
  - type: web
    name: investoai
    runtime: python
    plan: starter
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    domains:
      - investoai.in
    disk:
      name: investo-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: INVESTO_DB_PATH
        value: /opt/render/project/src/data/investo.sqlite3
